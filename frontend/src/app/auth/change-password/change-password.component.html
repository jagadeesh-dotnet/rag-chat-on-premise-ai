<main class="auth-page">
  <form class="auth-card" (ngSubmit)="submit()" #form="ngForm">
    <h1>Change password</h1>
    <p class="sub" *ngIf="(forced$ | async)?.must_change_password; else optional">
      You signed in with a temporary password. Choose your own to continue.
    </p>
    <ng-template #optional><p class="sub">At least 10 characters.</p></ng-template>

    <label>
      Current password
      <input name="current" type="password" [(ngModel)]="current" autocomplete="current-password" required />
    </label>
    <label>
      New password
      <input name="next" type="password" [(ngModel)]="next" autocomplete="new-password" minlength="10" required />
    </label>
    <label>
      Repeat new password
      <input name="repeat" type="password" [(ngModel)]="repeat" autocomplete="new-password" required />
    </label>

    <p class="error" *ngIf="mismatch">The new passwords don't match.</p>
    <p class="error" *ngIf="error" role="alert">{{ error }}</p>
    <button type="submit" class="primary" [disabled]="busy || !form.valid || mismatch">Change password</button>
    <button type="button" class="link" (click)="signOut()">Sign out</button>
  </form>
</main>
