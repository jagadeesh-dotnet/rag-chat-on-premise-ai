# Numbers computed with SQL, asked in the chat as admin (no row rules apply to admins).
# Grading = execution match: the reference query runs on the same data; every reference row must appear in the
# model's result tables (numbers within 0.01, text case-insensitive). Extra columns in the model's rows are fine.
#   source: spreadsheet | northwind | pubs
#   match_columns: [0, 2]  -> compare only these columns of the reference rows

- id: xl-total-sales
  source: spreadsheet
  question: What are the total sales in the spreadsheet?
  reference: SELECT ROUND(SUM(sales), 2) FROM amazon_store_sales_data

- id: xl-top-category
  source: spreadsheet
  question: Which category has the highest total sales in the spreadsheet?
  reference: >
    SELECT category, ROUND(SUM(sales), 2) FROM amazon_store_sales_data
    GROUP BY category ORDER BY 2 DESC LIMIT 1

- id: xl-sales-profit-per-category
  source: spreadsheet
  question: Show total sales and profit per category in the spreadsheet
  reference: >
    SELECT category, ROUND(SUM(sales), 2), ROUND(SUM(profit), 2) FROM amazon_store_sales_data GROUP BY category

- id: xl-orders-per-month-2020
  source: spreadsheet
  question: How many orders were there per month in 2020 in the spreadsheet?
  reference: >
    SELECT strftime(order_date, '%Y-%m'), COUNT(DISTINCT order_id) FROM amazon_store_sales_data
    WHERE year(order_date) = 2020 GROUP BY 1 ORDER BY 1

- id: xl-distinct-orders
  source: spreadsheet
  question: How many different orders are in the spreadsheet?
  reference: SELECT COUNT(DISTINCT order_id) FROM amazon_store_sales_data

- id: xl-top-customers-profit
  source: spreadsheet
  question: Who are the top 3 customers by profit in the spreadsheet?
  reference: >
    SELECT customer_name, ROUND(SUM(profit), 2) FROM amazon_store_sales_data
    GROUP BY customer_name ORDER BY 2 DESC LIMIT 3

- id: nw-top-customers-1997
  source: northwind
  question: Who were the top 5 Northwind customers by revenue in 1997?
  reference: >
    WITH r AS (SELECT TOP 5 o.CustomerID, SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) AS revenue
    FROM dbo.Orders o JOIN dbo.[Order Details] od ON od.OrderID = o.OrderID WHERE YEAR(o.OrderDate) = 1997
    GROUP BY o.CustomerID ORDER BY revenue DESC)
    SELECT c.CompanyName, ROUND(r.revenue, 2) FROM r JOIN dbo.Customers c ON c.CustomerID = r.CustomerID

- id: nw-employee-most-orders
  source: northwind
  question: Which Northwind employee handled the most orders?
  reference: >
    SELECT TOP 1 e.FirstName + ' ' + e.LastName, COUNT(*) FROM dbo.Orders o
    JOIN dbo.Employees e ON e.EmployeeID = o.EmployeeID GROUP BY e.FirstName, e.LastName ORDER BY 2 DESC

- id: nw-freight-1997
  source: northwind
  question: What was the total freight cost of Northwind orders in 1997?
  reference: SELECT ROUND(SUM(Freight), 2) FROM dbo.Orders WHERE YEAR(OrderDate) = 1997

- id: nw-top-products
  source: northwind
  question: What are the top 3 products by revenue in the Northwind database, with their category?
  reference: >
    WITH r AS (SELECT TOP 3 od.ProductID, SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) AS revenue
    FROM dbo.[Order Details] od GROUP BY od.ProductID ORDER BY revenue DESC)
    SELECT p.ProductName, c.CategoryName, ROUND(r.revenue, 2) FROM r JOIN dbo.Products p ON p.ProductID = r.ProductID
    JOIN dbo.Categories c ON c.CategoryID = p.CategoryID

- id: pubs-algodata-authors
  source: pubs
  question: Which authors are published by Algodata Infosystems?
  reference: >
    SELECT DISTINCT a.au_fname + ' ' + a.au_lname FROM authors a JOIN titleauthor ta ON ta.au_id = a.au_id
    JOIN titles t ON t.title_id = ta.title_id JOIN publishers p ON p.pub_id = t.pub_id
    WHERE p.pub_name = 'Algodata Infosystems'

- id: pubs-titles-per-publisher
  source: pubs
  question: How many titles does each publisher have in the pubs database?
  reference: >
    SELECT p.pub_name, COUNT(*) FROM publishers p JOIN titles t ON t.pub_id = p.pub_id GROUP BY p.pub_name
