# Document answers in the chat (as admin).
#   history: earlier turns (for follow-up questions)
#   must_search: the agent must call search_documents (true) or must not use any tool (false)
#   facts: each must appear in the answer (case-insensitive)
#   cite: {source, page?} that must be among the cited sources
#   no_citations: the answer must not cite anything
#   refusal: the answer must say it couldn't find the information (and invent nothing)
#   judge: also graded by the local model for faithfulness (test_judge.py)

- id: annual-leave
  question: How many days of annual leave do employees get?
  must_search: true
  facts: ["27"]
  cite: {source: hr/hr-handbook-sample.docx}
  judge: true

- id: clause-6.2
  question: What does clause 6.2 of ISO 27001 require?
  must_search: true
  facts: [objectives]
  cite: {source: iso27001.pdf, page: 11}
  judge: true

- id: control-A.5.15
  question: What does control A.5.15 say?
  must_search: true
  facts: [access]
  cite: {source: iso27001.pdf, page: 18}
  judge: true

- id: azure-vs-github
  question: Compare Azure Repos with GitHub
  must_search: true
  facts: [Azure Repos]
  cite: {source: Azure.docx}

- id: follow-up-clause-6.3
  history:
    - {role: user, content: "What does clause 6.2 of ISO 27001 require?"}
    - {role: assistant, content: "Clause 6.2 requires the organization to establish information security objectives at relevant functions and levels."}
  question: And what about clause 6.3?
  must_search: true
  facts: [change]
  cite: {source: iso27001.pdf, page: 11}

- id: small-talk
  question: Hi, who are you?
  must_search: false
  no_citations: true

- id: not-in-documents
  question: What is the company's travel expense limit per night for hotels?
  refusal: true

- id: not-in-documents-searches-first
  question: What is the company's travel expense limit per night for hotels?
  must_search: true
  refusal: true
  known_issue: refuses correctly but without searching first (the pre-search finds nothing, so the model skips it)

- id: follow-up-same-clause-again
  history:
    - {role: user, content: "What does clause 6.2 of ISO 27001 require?"}
    - {role: assistant, content: "Clause 6.2 requires the organization to establish information security objectives at relevant functions and levels."}
    - {role: user, content: "And what about clause 6.3?"}
    - {role: assistant, content: "Clause 6.3 requires that changes to the information security management system are carried out in a planned manner."}
  question: And clause 6.2 again?
  must_search: true
  cite: {source: iso27001.pdf, page: 11}
  # was a known issue (answered from the conversation without searching); fixed by the step 10 reminder, 3/3 runs
