# Search quality (GET /api/documents/search as admin, no language model involved).
#   expect: source (+ optional page) that must be in the top `within` results (default 3)
#   expect_nothing: true  -> an unrelated question must return no passages (min_score cutoff)
#   known_issue: "..."    -> a tracked failure: reported, doesn't lower the score

- id: clause-6.2
  question: clause 6.2 information security objectives
  expect: {source: iso27001.pdf, page: 11}

- id: follow-up-clause-6.2
  question: And what about clause 6.2?
  expect: {source: iso27001.pdf, page: 11}

- id: clause-6.3
  question: ISO 27001 clause 6.3 planning of changes
  expect: {source: iso27001.pdf, page: 11}

- id: control-A.5.15
  question: A.5.15 access control
  expect: {source: iso27001.pdf, page: 18}

- id: control-A.5.15-question
  question: What does control A.5.15 say?
  expect: {source: iso27001.pdf, page: 18}

- id: annual-leave
  question: How many days of annual leave do employees get?
  expect: {source: hr/hr-handbook-sample.docx}
  within: 1

- id: holiday-synonym
