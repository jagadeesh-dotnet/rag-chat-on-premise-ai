[pytest]
pythonpath = .
testpaths = tests
# `pytest` runs the fast unit/integration tests only. The answer-quality evaluation needs the running
# backend, Ollama and SQL Server and takes minutes:  pytest -m eval   (report: tests/eval/reports/latest.md)
addopts = -ra -m "not eval"
markers =
    eval: answer-quality evaluation against the running app
    retrieval: search finds the right page (recall@3, MRR)
    sql: numbers computed with SQL match a reference query
    documents: answers contain the facts and cite the right passage
    judge: the local model checks every claim is supported by its passages
    security: users only get what their role and row rules allow, and nothing is invented
